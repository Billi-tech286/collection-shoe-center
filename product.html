<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product | Collection Shoe Center</title>
  <meta name="description" content="View footwear details from Collection Shoe Center." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#1e1712;--paper:#f4ede3;--cream:#fffaf3;--muted:#786b5c;--line:#ded2c3;--orange:#b9522c;--display:"Fraunces",Georgia,serif;--body:"Work Sans",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:0 1.3rem}.site-header{border-bottom:1px solid var(--line);background:var(--paper)}.header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{display:flex;align-items:center;gap:.65rem;font:700 1.2rem var(--display)}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--ink);color:var(--paper);border-radius:50%;font-size:.85rem}.nav{display:flex;gap:1.2rem;color:var(--muted);font-size:.9rem}.nav a:hover{color:var(--orange)}.product-view{display:grid;grid-template-columns:1fr 1fr;gap:4rem;padding:5rem 0}.gallery{background:#e4d9cb;aspect-ratio:1/.92;overflow:hidden}.gallery img{width:100%;height:100%;object-fit:cover}.eyebrow{color:var(--orange);font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.details h1{font:700 clamp(2.5rem,6vw,4.6rem)/1 var(--display);margin:.8rem 0 1rem}.description{color:var(--muted);line-height:1.75;max-width:48ch}.price{font:700 1.6rem var(--display);color:var(--orange);margin:2rem 0}.field{margin:1.4rem 0}.field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:.6rem}.options{display:flex;flex-wrap:wrap;gap:.5rem}.option{border:1px solid var(--line);background:transparent;padding:.7rem .9rem;cursor:pointer}.option.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}select{border:1px solid var(--line);background:var(--cream);padding:.85rem;width:100%;color:var(--ink)}.btn{border:0;border-radius:4px;padding:1rem 1.3rem;cursor:pointer;font-weight:700}.btn-primary{background:var(--ink);color:var(--paper)}.btn-primary:hover{background:var(--orange)}.actions{display:flex;gap:.7rem;flex-wrap:wrap}.message{color:var(--orange);min-height:1.3rem;font-size:.85rem}.footer{border-top:1px solid var(--line);padding:3rem 0;color:var(--muted);font-size:.86rem}@media(max-width:760px){.nav a:not(.cart-link){display:none}.product-view{grid-template-columns:1fr;gap:2rem;padding:3rem 0}.details h1{font-size:3rem}}
    /* Keep product detail visually continuous with the homepage. */
    :root{--ink:#f4e9d8;--paper:#1c140f;--cream:rgba(244,233,216,.06);--muted:#c3ac91;--line:rgba(244,233,216,.14);--orange:#cf6a35}
    body{background:#1c140f;color:var(--ink);position:relative;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(48rem 30rem at 12% -6%,rgba(207,106,53,.16),transparent 60%),radial-gradient(38rem 26rem at 106% 18%,rgba(205,163,85,.1),transparent 60%),linear-gradient(185deg,#201712 0%,#17100b 55%,#140d09 100%)}
    .site-header{background:rgba(20,13,9,.82);border-bottom-color:var(--line);box-shadow:0 18px 40px rgba(0,0,0,.2)}
    .brand-mark{background:linear-gradient(150deg,var(--orange),#a8501f);color:var(--ink);border-radius:.7rem;box-shadow:0 8px 20px rgba(207,106,53,.35)}
    .nav{color:var(--muted)}.nav a:hover{color:var(--ink)}.cart-link{color:var(--ink)}
    .gallery{background:rgba(244,233,216,.06);border:1px solid var(--line);border-radius:1.2rem;box-shadow:0 24px 60px rgba(0,0,0,.18)}
    .description{color:var(--muted)}.price{color:var(--orange)}
    .option{border-color:var(--line);color:var(--ink)}.option.active{background:var(--orange);color:#1a1108;border-color:var(--orange)}
    select{border-color:var(--line);background:rgba(0,0,0,.18);color:var(--ink)}
    .btn-primary{background:linear-gradient(140deg,var(--orange),#a8501f);color:#1a1108}.btn-primary:hover{background:var(--orange)}
    .footer{border-top-color:var(--line);background:rgba(20,13,9,.45);color:var(--muted)}
    @media(max-width:760px){.product-view{padding:3.5rem 0;gap:2rem}.details h1{font-size:clamp(2.5rem,12vw,4rem)}}
  </style>
</head>
<body>
  <header class="site-header"><div class="shell header-inner"><a class="brand" href="index.html"><span class="brand-mark">CS</span> COLLECTION SHOE CENTER</a><nav class="nav"><a href="index.html">Home</a><a href="catalog.html">Shop</a><a href="index.html#contact">Visit us</a><a class="cart-link" href="checkout.html">Cart <span id="cartCount">0</span></a><a href="checkout.html">Checkout</a></nav></div></header>
  <main class="shell"><div id="productView" class="product-view"><div class="gallery"><img id="productImage" alt="" /></div><div class="details"><span class="eyebrow">Collection Shoe Center</span><h1 id="productName">Loading...</h1><p id="productDescription" class="description"></p><div id="productPrice" class="price"></div><div class="field"><label>Color</label><div id="colors" class="options"></div></div><div class="field"><label for="size">Size</label><select id="size"><option value="">Select size</option></select></div><p id="message" class="message" aria-live="polite"></p><div class="actions"><button id="add" class="btn btn-primary" type="button">Add to cart</button><a class="btn" href="catalog.html">Continue shopping</a></div></div></div></main>
  <footer class="footer"><div class="shell"><strong>COLLECTION SHOE CENTER</strong><br />Janakpurdham, Dhanusha, Nepal</div></footer>
  <script src="product.js"></script>
</body>
</html>
